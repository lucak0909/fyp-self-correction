name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (e.g. one branch based on another, not on
  # main) still need CI to run against their actual base branch.
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy

  # Patch/diff coverage: fails if newly added or changed lines in the PR
  # aren't exercised by tests. Only meaningful with a PR base to diff
  # against, so it doesn't run on direct pushes to main.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Fetch PR base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Run tests with coverage
        run: pytest --cov=fyp_agent --cov-report=xml

      - name: Check diff coverage
        run: >
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.event.pull_request.base.ref }}
          --fail-under=80

  # Single required status check, independent of the jobs above.
  ci-success:
    needs: [test, lint, typecheck, coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "Typecheck job did not succeed: ${{ needs.typecheck.result }}"
            exit 1
          fi
          if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage job did not succeed: ${{ needs.coverage.result }}"
            exit 1
          fi
