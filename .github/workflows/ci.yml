name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # Single required status check, independent of the matrix shape above.
  ci-success:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test job result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
