[project]
name = "fyp-agent"
version = "0.1.0"
description = "When Does Self-Correction Help? An empirical study of feedback-driven repair in LLM coding agents."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "datasets>=2.19",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
    "ruff>=0.7",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fyp_agent"]
omit = ["src/fyp_agent/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (common bug patterns)
]

[tool.ruff.lint.per-file-ignores]
# typer's documented API requires `typer.Option(...)` as an argument default.
"src/fyp_agent/cli.py" = ["B008"]
